name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: lint + tests (local sandbox)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  docker:
    name: end-to-end (Docker sandbox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q -m docker
        env:
          RUN_DOCKER_TESTS: "1"

  windows:
    name: Windows (local sandbox) + double-click runner
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      # The same script a person double-clicks, under Windows PowerShell 5.1, with a
      # mock model in place of Gemini so no API key is needed.
      - name: run_eval.ps1 with a mock model, one round
        shell: powershell
        env:
          TIE_PACKAGE: ${{ github.workspace }}
          TIE_MODEL: mockllm/model
          TIE_ROUNDS: "1"
        run: |
          & .\scripts\windows\run_eval.ps1
          Get-Content scripts\windows\STATUS.txt
          if ((Get-Content scripts\windows\STATUS.txt -Tail 1) -notmatch '  DONE') { exit 1 }
          Get-Content scripts\windows\results\RESULTS.md
          if (-not (Select-String -Path scripts\windows\results\RESULTS.md -Pattern '- mockllm/model: 1 round(s)' -SimpleMatch -Quiet)) { exit 1 }
