[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-injection-eval"
version = "0.1.0"
description = "Indirect prompt-injection eval for tool-using LLM agents, with a deterministic grader that is itself tested."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    # Pinned: Inspect moves fast, and results should be reproducible.
    # (Inspect 0.3.281+ needs Python 3.11.)
    "inspect-ai==0.3.289",
]

[project.optional-dependencies]
# The Gemini SDK: Inspect's google provider and the runner's model choice use it.
gemini = ["google-genai>=1.50"]
dev = ["pytest>=8", "ruff>=0.6", "google-genai>=1.50"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tool_injection_eval = ["sandbox/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: end-to-end tests that start real Docker sandboxes (set RUN_DOCKER_TESTS=1)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
